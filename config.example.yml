device:
  host: "device.example.invalid"
  port: 22
  username: automation
  password_env: SWITCH_PASSWORD
  # Transport to the CLI. 'ssh' (default, port 22) or 'telnet' (default port
  # 23). Many switches ship with SSH disabled and are managed over telnet until
  # it is turned on, so the crawler can reach either.
  transport: ssh
  # A Cisco-like login lands in an unprivileged view ('Switch>'); the full
  # command surface and the running configuration sit behind an 'enable' step
  # ('Switch#'). Turn this on to raise the session to privileged mode right
  # after login, so the crawl sees privileged and configuration commands too.
  enable: false
  # The command that elevates. 'enable' on most platforms; some use 'super'.
  enable_command: enable
  # Environment variable holding the enable secret. Leave the variable unset
  # when the device grants enable without a password; a wrong secret is
  # reported as a clear error rather than a silent under-scan.
  enable_password_env: ENABLE_SECRET
  prompt_pattern: '(?m)^[^\r\n]+[>#]\s*$'
  connect_timeout: 10
  read_timeout: 4
  idle_timeout: 0.35
  # A running configuration is far larger than a help answer and arrives in
  # pages, so reading it has its own budget rather than the per-query timeout.
  capture_timeout: 120
  max_response_bytes: 2097152

discovery:
  max_depth: 32
  max_queries: 100000
  # Extra shell channels over the same SSH connection speed up the crawl.
  # Devices with a low vty limit silently fall back to fewer channels.
  parallel_channels: 1
  # Optional targeted branches are scanned after the full root command tree.
  seed_commands: []
  # Read-only commands run once before the crawl so every report states which
  # firmware it describes; a catalog cannot be compared across versions without
  # it. Vendors disagree on the verb ('display version' on VRP-style CLIs), and
  # a command that could modify the device is rejected. Hostname, serial, MAC
  # and credential lines are stripped from the output. Set to [] to disable.
  version_commands:
    - show version
  # Read-only commands that print the running configuration. It is parsed and
  # held against the catalog the crawl builds: a configured line the crawl
  # never found is the one piece of evidence that the command surface is
  # incomplete, without needing a second device to compare against. The
  # dialects below are tried in order and the first that answers is used;
  # passwords and keys are stripped, but the parsed tree still describes one
  # real network and is written to a separate, private file. Set to [] to skip.
  config_commands:
    - display current-configuration
    - show running-config
  # Some NOS implementations can attach side effects even to contextual '?'.
  # Validate the platform in a lab and list branches that must not be expanded.
  denied_tokens: []
  parameter_policy: explore
  # A context-opening probe executes what it types. By default it types only
  # values you supply in parameter_samples: filling a numeric range with its
  # minimum can apply 'speed 10' or 'mtu 68' to a live port. Turn this on only
  # against a lab device, to reach every last context.
  probe_invented_values: false
  # How --enter-modes decides what to type when looking for a new context.
  # 'safe' (default) probes only commands whose head verb enters a container the
  # session can leave again (configure, interface, vlan, vrf, router, ...); any
  # other statement at a config prompt takes effect the moment it is typed
  # ('urpf enable', 'dhcp start', 'flush arp all'), so it is reported, not run.
  # 'aggressive' probes every executable leaf: it reaches more modes but mutates
  # the device, so use it only against a lab switch.
  probe_policy: safe
  # Extra head verbs the safe policy should treat as mode entries, for a
  # platform whose container verb is not in the built-in set. Ignored when
  # probe_policy is 'aggressive'.
  mode_entry_verbs: []
  # 'compare' mode re-queries every documented command on the device to catch
  # ones the crawl missed. A full vendor manual holds tens of thousands, so the
  # pass is capped here and the surplus is reported as unverified rather than
  # run - a bound on run time and on load against a fragile control plane. Set
  # to 0 to verify every documented command (slow on a large manual).
  compare_verify_limit: 2000
  # How this platform's contextual help deviates from the strict reading. Both
  # trade a class of missed commands for a class of invented ones, so enable
  # each only after seeing the behaviour in a lab (see the parser audit notes).
  parser_profile:
    # Read a bare indented word (no description) as an option.
    accept_undescribed_options: false
    # Treat error/invalid/unknown/... inside the option block as command names.
    error_words_are_commands: false
  # Numeric ranges such as <1-4094> receive an automatic sample. Add one real
  # value for parameter kinds that cannot be inferred from contextual help.
  # A configured key also marks a lowercase documentation token as a parameter.
  parameter_samples: {}
  # parameter_samples:
  #   WORD: Ethernet1/1
  #   A.B.C.D: 192.0.2.1

output:
  documentation_catalog: output/cli_doc.yml
  device_catalog: output/cli_real.yml
  comparison_catalog: output/cli_compare.yml
  html_report: output/missing_commands.html
  # Nested token tree and a flat human-readable command list.
  tree_catalog: output/commands_tree.yml
  human_catalog: output/commands_human.yml
  # The device's own running configuration, parsed into a view tree and
  # annotated with the lines the catalog cannot explain. It describes one real
  # network, so it is written apart from the shareable catalog and kept private.
  config_tree: output/config_tree.yml
  # Opt in only while troubleshooting: device output may contain sensitive data.
  raw_log: null
