name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Static security scan
        run: bandit -q -r src

      - name: Audit dependencies
        if: matrix.python-version == '3.14'
        # Paramiko exposes legacy ssh-rsa support, but CLIRadar disables that
        # host-key and user-signature algorithm in every connection.
        run: pip-audit --ignore-vuln PYSEC-2026-2858

      - name: Build distributions
        if: matrix.python-version == '3.14'
        run: python -m build

      - name: Verify wheel installation
        if: matrix.python-version == '3.14'
        run: |
          python -m venv /tmp/cliradar-wheel
          /tmp/cliradar-wheel/bin/pip install dist/*.whl
          /tmp/cliradar-wheel/bin/cliradar --version
